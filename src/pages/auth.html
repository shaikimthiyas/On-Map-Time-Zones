<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOROLOGIUM // Operator Authentication</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles/main.css"/>
    <style>
        .auth-page {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--bg-canvas);
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 24px 60px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface-1);
            border: 1px solid var(--border-hairline);
            border-radius: var(--radius-xs);
            padding: 36px 32px;
            text-align: left;
        }

        .auth-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.1em;
            color: var(--accent-primary);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .auth-card h1 {
            font-family: var(--font-editorial);
            font-size: 32px;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .auth-card p.subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .form-row {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            background: var(--bg-canvas);
            border: 1px solid var(--border-hairline);
            border-radius: var(--radius-xs);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 13px;
            padding: 10px 12px;
            outline: none;
            transition: border-color var(--transition-fast);
        }

        .form-input:focus {
            border-color: var(--border-focus);
        }

        .auth-btn {
            height: 38px;
            width: 100%;
            background: var(--text-primary);
            color: var(--bg-canvas);
            border: 1px solid var(--text-primary);
            border-radius: var(--radius-xs);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all var(--transition-fast);
            margin-top: 8px;
        }

        .auth-btn:hover {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: #ffffff;
        }

        .autofill-btn {
            margin-top: 16px;
            padding: 8px 12px;
            background: var(--bg-canvas);
            border: 1px dashed var(--border-hairline);
            border-radius: var(--radius-xs);
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-tertiary);
            cursor: pointer;
            text-align: center;
            transition: all var(--transition-fast);
        }

        .autofill-btn:hover {
            border-color: var(--border-focus);
            color: var(--text-primary);
        }

        .auth-status {
            margin-top: 14px;
            font-family: var(--font-mono);
            font-size: 11px;
            text-align: center;
        }

        .auth-status.success {
            color: var(--accent-secondary);
        }

        .auth-status.error {
            color: var(--accent-primary);
        }
    </style>
</head>
<body class="auth-page">

    <!-- Top Telemetry Bar -->
    <header class="telemetry-bar">
        <div class="telemetry-left">
            <a href="/index.html" class="brand-monogram">
                <span class="brand-dot"></span>
                <span>HOROLOGIUM</span>
            </a>
            <span class="telemetry-title">Security Gateway</span>
        </div>

        <div class="telemetry-right">
            <button type="button" class="telemetry-btn" id="loginThemeToggle">DECK</button>
            <a href="/src/pages/map.html" class="nav-action-btn">MAP VIEW</a>
            <a href="/src/pages/country.html" class="nav-action-btn">DIRECTORY</a>
            <a href="/index.html" class="nav-action-btn">OVERVIEW</a>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-tag">SECURITY CLEARANCE // LEVEL-01</div>
            <h1>Operator Access</h1>
            <p class="subtitle">Authenticate credentials to persist geodesic pins, working hour window presets, and multi-meridian telemetry logs.</p>

            <form id="loginForm">
                <div class="form-row">
                    <label class="form-label" for="username">OPERATOR CALLSIGN / USERNAME</label>
                    <input type="text" id="username" class="form-input" placeholder="admin" required autocomplete="username" />
                </div>
                <div class="form-row">
                    <label class="form-label" for="password">ACCESS CIPHER / PASSWORD</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
                </div>

                <button type="submit" class="auth-btn">VERIFY ACCESS KEY</button>

                <div class="autofill-btn" id="demoAutofill">
                    [ AUTOFILL DEMO OPERATOR: <code>admin</code> / <code>password123</code> ]
                </div>

                <div class="auth-status" id="authStatus"></div>
            </form>
        </div>
    </div>

    <script type="module">
        const form = document.getElementById("loginForm");
        const statusEl = document.getElementById("authStatus");
        const autofillBtn = document.getElementById("demoAutofill");

        autofillBtn.addEventListener("click", () => {
            document.getElementById("username").value = "admin";
            document.getElementById("password").value = "password123";
            statusEl.textContent = "";
        });

        form.addEventListener("submit", async function(e) {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const submitBtn = form.querySelector('button[type="submit"]');

            submitBtn.disabled = true;
            submitBtn.textContent = "VERIFYING CLEARANCE...";

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (data.success && data.token) {
                    localStorage.setItem("horologium_operator_token", data.token);
                    localStorage.setItem("horologium_operator_callsign", data.operator.callsign);
                    statusEl.className = "auth-status success";
                    statusEl.textContent = `✓ CLEARANCE GRANTED (${data.operator.callsign.toUpperCase()}): Navigating to flight deck...`;
                    setTimeout(() => {
                        window.location.href = "/src/pages/map.html";
                    }, 800);
                } else {
                    statusEl.className = "auth-status error";
                    statusEl.textContent = `✗ CREDENTIAL FAILURE: ${data.error || 'Invalid credentials.'}`;
                }
            } catch (err) {
                // Offline fallback for demo operator
                if (username === "admin" && password === "password123") {
                    statusEl.className = "auth-status success";
                    statusEl.textContent = "✓ CLEARANCE GRANTED (OFFLINE BUFFER): Loading telemetry...";
                    setTimeout(() => {
                        window.location.href = "/src/pages/map.html";
                    }, 800);
                } else {
                    statusEl.className = "auth-status error";
                    statusEl.textContent = "✗ CREDENTIAL FAILURE: Access cipher not recognized.";
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "VERIFY ACCESS KEY";
            }
        });

        // Theme Toggle
        const themeBtn = document.getElementById('loginThemeToggle');
        themeBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            themeBtn.textContent = isDark ? 'DECK' : 'ATLAS';
            localStorage.setItem('horologium_theme', isDark ? 'dark' : 'light');
        });

        if (localStorage.getItem('horologium_theme') === 'light' || localStorage.getItem('chronos_theme') === 'light') {
            document.documentElement.classList.remove('dark');
            themeBtn.textContent = 'ATLAS';
        }
    </script>
</body>
</html>
