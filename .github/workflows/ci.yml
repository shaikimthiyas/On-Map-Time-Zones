name: Horologium CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Production Frontend Build
        run: npm run build

      - name: Test Server Boot & SQLite Health Check
        run: |
          node -e "import('./server.js').then(() => { setTimeout(() => fetch('http://localhost:3001/api/health').then(r => r.json()).then(d => { if (d.status === 'ONLINE') { console.log('CI HEALTH CHECK PASSED'); process.exit(0); } else { process.exit(1); } }), 1000); });"
